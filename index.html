<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RANDYS Worldwide — Reman Production Planning</title>
<style>
:root{
  --brand-orange:#F26122;--brand-orange-light:#FF7936;--brand-black:#231F20;
  --brand-gray-light:#E9E9E9;--brand-gray:#B3B3B3;--brand-white:#FFFFFF;
  --ok:#2e7d32;--okl:#e8f5e9;--warn:#b26a00;--bad:#c62828;--badl:#fdecea;
  --font-heading:'Antique Olive Bold','Helvetica Neue',Arial,sans-serif;
  --font-body:'Helvetica Neue',Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);font-size:14px;line-height:1.4;background:var(--brand-gray-light);color:var(--brand-black)}

/* Header */
header.app{background:var(--brand-black);color:var(--brand-white);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px}
header.app .brand{display:flex;align-items:center;gap:14px}
header.app .brand img{height:42px;display:block}
header.app .brand h1{font-family:var(--font-heading);text-transform:uppercase;font-size:18px;letter-spacing:1px;line-height:1.1}
header.app .brand .tag{font-size:10px;color:var(--brand-gray);text-transform:uppercase;letter-spacing:2px;margin-top:3px}
header.app .updated{text-align:right;font-size:12px}
header.app .updated .label{color:var(--brand-gray);text-transform:uppercase;letter-spacing:1px;font-size:10px;display:block}
header.app .updated .stamp{font-weight:bold;font-size:14px;color:var(--brand-orange-light)}
header.app .updated .hint{color:var(--brand-gray);font-size:10px;margin-top:2px}

/* Tab bar */
.tabbar{background:var(--brand-black);display:flex;align-items:stretch;border-bottom:3px solid var(--brand-orange);flex-wrap:wrap}
.tabbar button{background:none;border:none;color:var(--brand-gray);padding:12px 30px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-3px;transition:all .15s;font-family:var(--font-body);white-space:nowrap}
.tabbar button.active{color:var(--brand-orange);border-bottom-color:var(--brand-orange)}
.tabbar button:hover:not(.active){color:#fff}
.tabbar button .cnt{color:var(--brand-gray);font-weight:400;margin-left:6px}

.panel{display:none;padding:18px 24px 60px}
.panel.active{display:block}

/* Toolbar */
.toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.toolbar input[type=search]{font-family:var(--font-body);font-size:13px;padding:.5rem .7rem;border:1px solid var(--brand-gray);border-radius:4px;min-width:280px}
.toolbar label{font-size:12px;display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.toolbar .btn{font-family:var(--font-body);text-transform:uppercase;font-weight:bold;font-size:11px;letter-spacing:.5px;border:none;border-radius:4px;padding:.5rem 1.1rem;cursor:pointer}
.toolbar .btn-primary{background:var(--brand-orange);color:#fff}
.toolbar .btn-primary:hover{background:var(--brand-orange-light)}
.toolbar .spacer{flex:1}

/* Summary tiles */
.tiles{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.tile{background:#fff;border:1px solid #ddd;border-left:4px solid var(--brand-orange);border-radius:5px;padding:10px 16px;min-width:130px}
.tile .v{font-family:var(--font-heading);font-size:24px;line-height:1}
.tile .k{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#777;margin-top:5px}
.tile.warn{border-left-color:var(--bad)}
.tile.good{border-left-color:var(--ok)}

/* Table */
.tablewrap{overflow-x:auto;background:#fff;border:1px solid #ddd;border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
thead th{position:sticky;top:0;z-index:2}
thead tr.groups th{background:var(--brand-black);color:#fff;font-family:var(--font-heading);text-transform:uppercase;letter-spacing:.5px;font-size:11px;padding:6px 8px;text-align:center;border-left:1px solid #444}
thead tr.cols th{background:#3a3536;color:#fff;font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;padding:7px 8px;text-align:center;border-left:1px solid #4a4445;cursor:pointer;white-space:nowrap}
thead tr.cols th:hover{background:var(--brand-orange)}
thead tr.cols th .arrow{opacity:.5;font-size:9px;margin-left:2px}
tbody td{padding:5px 8px;border-bottom:1px solid #eee;border-left:1px solid #f2f2f2;white-space:nowrap}
tbody td.desc{white-space:normal;min-width:280px;max-width:460px;font-size:11.5px;color:#333}
tbody tr:nth-child(even){background:#fafafa}
tbody tr:hover{background:#fff4ee}
.num{text-align:right;font-variant-numeric:tabular-nums}
.ctr{text-align:center}
td.sku{font-weight:700}
/* value emphasis */
.need-pos{font-weight:700;color:var(--brand-orange)}
.need-neg{color:#999}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.pill.order{background:var(--badl);color:var(--bad)}
.pill.not{background:#eee;color:#888}
tr.hot td{background:#fff6ef}
tr.hot:nth-child(even) td{background:#fdefe4}
.empty{padding:40px;text-align:center;color:#888}
footer.app{padding:14px 24px;color:#888;font-size:11px;text-align:center}
</style>
</head>

/* ── Per-tab engine config ──────────────────────────────────────────────── */
const TAB_ORDER = ["transfer_cases","manual_trans","differential"];
const TAB_CFG = {
  transfer_cases: {
    buildWHs:[{wh:"MN1",name:"Zumbrota"},{wh:"IA1",name:"Evolution"}],
    buildDCs:[{dc:"A-WH_MN1",name:"Zumbrota"},{dc:"A-WH_IA1",name:"Evolution"}],
    showWithinDCs:true, withinDCsInNeed:true, showEvo:true, showPrimary:true,
    clamp:false, coreAvailMode:"MNIA"
  },
  manual_trans: {
    buildWHs:[{wh:"MN1",name:"On Hand"}],
    buildDCs:[{dc:"A-WH_MN1",name:"In Process"}],
    showWithinDCs:false, withinDCsInNeed:false, showEvo:false, showPrimary:false,
    clamp:true, coreAvailMode:"MN"
  },
  differential: {
    buildWHs:[{wh:"MN1",name:"On Hand"}],
    buildDCs:[{dc:"A-WH_MN1",name:"In Process"}],
    showWithinDCs:true, withinDCsInNeed:false, showEvo:false, showPrimary:false,
    clamp:true, coreAvailMode:"MN"
  }
};

/* ── Live-data lookups ──────────────────────────────────────────────────── */
function avail(item, wh){ const m = LIVE.inventory[item]; return m && m[wh] ? m[wh] : 0; }
function totalAvail(item){ const m = LIVE.inventory[item]; if(!m) return 0; let s=0; for(const k in m) s+=m[k]; return s; }
function openMo(sku, dc){ const m = LIVE.openmos[sku]; return m && m[dc] ? m[dc] : 0; }

/* ── Compute one tab's rows ─────────────────────────────────────────────── */
function computeTab(key){
  const cfg = TAB_CFG[key];
  const tab = BASELINE.tabs[key];
  const primary = tab.primary_location || {};
  const rows = tab.rows.map(r=>{
    const ohByWH = cfg.buildWHs.map(b=>({name:b.name, wh:b.wh, v:avail(r.sku,b.wh)}));
    const sumOH = ohByWH.reduce((a,b)=>a+b.v,0);
    const withinDCs = totalAvail(r.sku) - sumOH;
    const moByDC = cfg.buildDCs.map(b=>({name:b.name, dc:b.dc, v:openMo(r.sku,b.dc)}));
    const sumMO = moByDC.reduce((a,b)=>a+b.v,0);
    let need = r.avg_monthly - sumOH - sumMO - (cfg.withinDCsInNeed ? withinDCs : 0);
    if(cfg.clamp) need = Math.max(0, need);
    need = Math.round(need);
    const core = r.core || "";
    const coreMN = core ? avail(core,"MN1") : 0;
    const coreIA = core ? avail(core,"IA1") : 0;
    const coreTotal = core ? totalAvail(core) : 0;
    return {
      sku:r.sku, evo:r.evo||"", desc:r.desc, grand_total:r.grand_total,
      avg_monthly:r.avg_monthly, std_dev:r.std_dev,
      ohByWH, withinDCs:Math.round(withinDCs), moByDC, need,
      core, coreMN, coreIA, coreTotal,
      primary: primary[r.sku] || ""
    };
  });
  // Total cores to consume = sum of Needed across rows sharing the same core.
  const byCore = {};
  rows.forEach(r=>{ if(r.core){ byCore[r.core]=(byCore[r.core]||0)+r.need; } });
  rows.forEach(r=>{
    r.coresToConsume = r.core ? Math.round(byCore[r.core]) : 0;
    r.toOrder = r.core ? (r.coreTotal < r.coresToConsume) : false;
    r.coreAvailText = cfg.coreAvailMode==="MNIA"
      ? (r.coreMN + " in MN and " + r.coreIA + " in IA")
      : (r.coreTotal + " in MN");
  });
  return rows;
}

/* ── Column definitions per tab ─────────────────────────────────────────── */
function columnsFor(key){
  const cfg = TAB_CFG[key];
  const c = [];
  c.push({id:"sku",  grp:"", head:"SKU", cls:"sku", get:r=>r.sku});
  if(cfg.showEvo) c.push({id:"evo", grp:"", head:"EVO SKU", get:r=>r.evo});
  c.push({id:"desc", grp:"", head:"Description", cls:"desc", get:r=>r.desc});
  c.push({id:"grand_total", grp:"2025 Sales Data", head:"Grand Total", num:true, get:r=>r.grand_total});
  c.push({id:"avg_monthly", grp:"2025 Sales Data", head:"Avg Monthly", num:true, get:r=>r.avg_monthly});
  c.push({id:"std_dev", grp:"2025 Sales Data", head:"Std Dev", num:true, get:r=>r.std_dev});
  cfg.buildWHs.forEach((b,i)=>{
    c.push({id:"oh"+i, grp:"Current On Hand", head:b.name, num:true, get:r=>r.ohByWH[i].v});
  });
  if(cfg.showWithinDCs) c.push({id:"within", grp:"Current On Hand", head:"Within DCs", num:true, get:r=>r.withinDCs});
  cfg.buildDCs.forEach((b,i)=>{
    c.push({id:"mo"+i, grp:"Open MOs", head:b.name, num:true, get:r=>r.moByDC[i].v});
  });
  c.push({id:"need", grp:"Plan", head:"Needed", num:true, get:r=>r.need,
          render:r=>`<span class="${r.need>0?'need-pos':'need-neg'}">${r.need}</span>`});
  c.push({id:"core", grp:"Cores", head:"Core Required", get:r=>r.core});
  c.push({id:"coreAvail", grp:"Cores", head:"Core Availability", get:r=>r.coreAvailText});
  c.push({id:"coresToConsume", grp:"Cores", head:"Total Cores To Consume", num:true, get:r=>r.coresToConsume});
  if(cfg.showPrimary) c.push({id:"primary", grp:"", head:"Primary Location", get:r=>r.primary});
  c.push({id:"toOrder", grp:"Cores", head:"To Order", cls:"ctr", get:r=>r.toOrder?"ORDER CORES":"Not",
          render:r=>`<span class="pill ${r.toOrder?'order':'not'}">${r.toOrder?'Order Cores':'Not'}</span>`});
  return c;
}

/* ── State ──────────────────────────────────────────────────────────────── */
const state = {}; // per tab: {rows, cols, sort:{id,dir}, q, onlyNeed}

function fmt(v, num){
  if(num){ return (v===0||v)? Number(v).toLocaleString() : ""; }
  return (v===null||v===undefined)? "" : v;
}

function renderTiles(key){
  const rows = state[key].rows;
  const needing = rows.filter(r=>r.need>0);
  const totalUnits = needing.reduce((a,r)=>a+r.need,0);
  const toOrder = rows.filter(r=>r.toOrder).length;
  const tiles = [
    {k:"SKUs", v:rows.length},
    {k:"Need Build", v:needing.length, cls:needing.length?"warn":"good"},
    {k:"Units To Build", v:totalUnits.toLocaleString(), cls:totalUnits?"warn":"good"},
    {k:"Cores To Order", v:toOrder, cls:toOrder?"warn":"good"},
  ];
  return `<div class="tiles">`+tiles.map(t=>`<div class="tile ${t.cls||''}"><div class="v">${t.v}</div><div class="k">${t.k}</div></div>`).join("")+`</div>`;
}

function renderTable(key){
  const st = state[key];
  const cols = st.cols;
  let rows = st.rows.slice();
  // filter
  if(st.q){ const q=st.q.toLowerCase(); rows = rows.filter(r=>(r.sku+" "+r.desc+" "+(r.evo||"")+" "+(r.core||"")).toLowerCase().includes(q)); }
  if(st.onlyNeed){ rows = rows.filter(r=>r.need>0); }
  // sort
  if(st.sort){
    const col = cols.find(c=>c.id===st.sort.id);
    const dir = st.sort.dir;
    rows.sort((a,b)=>{
      let va=col.get(a), vb=col.get(b);
      if(typeof va==="string"||typeof vb==="string"){ va=(va||"").toString().toLowerCase(); vb=(vb||"").toString().toLowerCase(); return va<vb?-dir:va>vb?dir:0; }
      return (va-vb)*dir;
    });
  }
  // Two-row header: ungrouped columns span both rows; grouped columns share a
  // group cell on the top row and their own cell on the bottom row.
  let gh = "<tr class='groups'>";
  let ch = "<tr class='cols'>";
  let i=0;
  while(i<cols.length){
    const c=cols[i];
    if(c.grp===""){
      const ar = st.sort&&st.sort.id===c.id ? (st.sort.dir>0?"▲":"▼") : "↕";
      gh += `<th rowspan="2" data-col="${c.id}" class="sortable">${c.head}<span class="arrow">${ar}</span></th>`;
      i++;
    } else {
      let span=1; while(i+span<cols.length && cols[i+span].grp===c.grp) span++;
      gh += `<th colspan="${span}">${c.grp}</th>`;
      for(let j=0;j<span;j++){ const cc=cols[i+j]; const ar = st.sort&&st.sort.id===cc.id ? (st.sort.dir>0?"▲":"▼") : "↕"; ch += `<th data-col="${cc.id}">${cc.head}<span class="arrow">${ar}</span></th>`; }
      i+=span;
    }
  }
  gh+="</tr>"; ch+="</tr>";

  let body="";
  if(!rows.length){ body=`<tr><td class="empty" colspan="${cols.length}">No rows match.</td></tr>`; }
  else rows.forEach(r=>{
    const hot = r.need>0;
    body+=`<tr class="${hot?'hot':''}">`;
    cols.forEach(c=>{
      const cls = (c.num?"num ":"") + (c.cls||"");
      const html = c.render? c.render(r) : fmt(c.get(r), c.num);
      body+=`<td class="${cls.trim()}">${html}</td>`;
    });
    body+="</tr>";
  });
  return `<div class="tablewrap"><table><thead>${gh}${ch}</thead><tbody>${body}</tbody></table></div>`;
}

function renderPanel(key){
  const el = document.getElementById("panel-"+key);
  el.querySelector(".tiles-wrap").innerHTML = renderTiles(key);
  el.querySelector(".table-wrap").innerHTML = renderTable(key);
  // wire header sorting
  el.querySelectorAll("thead th[data-col]").forEach(th=>{
    th.style.cursor="pointer";
    th.onclick=()=>{
      const id=th.getAttribute("data-col");
      const st=state[key];
      if(st.sort&&st.sort.id===id){ st.sort.dir*=-1; } else { st.sort={id,dir: (id==="sku"||id==="desc"||id==="evo"||id==="core"||id==="primary")?1:-1}; }
      renderPanel(key);
    };
  });
}

function buildPanels(){
  const tabbar=document.getElementById("tabbar");
  const panels=document.getElementById("panels");
  TAB_ORDER.forEach((key,idx)=>{
    const tab=BASELINE.tabs[key];
    const rows=computeTab(key);
    const cols=columnsFor(key);
    state[key]={rows,cols,sort:{id:"need",dir:-1},q:"",onlyNeed:false};

    const btn=document.createElement("button");
    btn.className = idx===0?"active":"";
    btn.innerHTML = `${tab.label}<span class="cnt">${rows.length}</span>`;
    btn.onclick=()=>selectTab(key);
    btn.id="tabbtn-"+key;
    tabbar.appendChild(btn);

    const panel=document.createElement("div");
    panel.className="panel"+(idx===0?" active":"");
    panel.id="panel-"+key;
    panel.innerHTML=`
      <div class="toolbar">
        <input type="search" placeholder="Filter ${tab.label} — SKU, description, core…" id="q-${key}">
        <label><input type="checkbox" id="need-${key}"> Only show build-needed (Needed &gt; 0)</label>
        <div class="spacer"></div>
        <button class="btn btn-primary" id="csv-${key}">Export CSV</button>
      </div>
      <div class="tiles-wrap"></div>
      <div class="table-wrap"></div>`;
    panels.appendChild(panel);

    panel.querySelector("#q-"+key).addEventListener("input",e=>{ state[key].q=e.target.value; renderPanel(key); });
    panel.querySelector("#need-"+key).addEventListener("change",e=>{ state[key].onlyNeed=e.target.checked; renderPanel(key); });
    panel.querySelector("#csv-"+key).addEventListener("click",()=>exportCSV(key,tab.label));
    renderPanel(key);
  });
}

function selectTab(key){
  TAB_ORDER.forEach(k=>{
    document.getElementById("panel-"+k).classList.toggle("active",k===key);
    document.getElementById("tabbtn-"+k).classList.toggle("active",k===key);
  });
}

function exportCSV(key,label){
  const st=state[key];
  const cols=st.cols;
  let rows=st.rows.slice();
  if(st.q){ const q=st.q.toLowerCase(); rows=rows.filter(r=>(r.sku+" "+r.desc+" "+(r.evo||"")+" "+(r.core||"")).toLowerCase().includes(q)); }
  if(st.onlyNeed){ rows=rows.filter(r=>r.need>0); }
  const esc=v=>{ v=(v===null||v===undefined)?"":String(v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  const head=cols.map(c=>esc(c.grp?c.grp+" - "+c.head:c.head)).join(",");
  const lines=rows.map(r=>cols.map(c=>esc(c.id==="toOrder"?(r.toOrder?"ORDER CORES":"Not"):c.get(r))).join(","));
  const csv=[head,...lines].join("\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="Reman_"+label.replace(/\s+/g,"_")+"_"+(LIVE.generated||"").replace(/[^0-9]/g,"")+".csv";
  a.click(); URL.revokeObjectURL(a.href);
}

document.getElementById("asof").textContent = LIVE.generated || "no data yet — run Reman Refresh.bat";
buildPanels();
</script>
</body>
</html>
